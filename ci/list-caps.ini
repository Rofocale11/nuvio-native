# The list-cap registry: one section per cap-shaped site in non-test Rust, read by
# `ci/check-list-caps.py`. Keyed `[file::symbol]`, file relative to rust-modules/, symbol the function
# the cut sits in (else the const/struct it belongs to); several hits in one symbol share a section
# whose reason covers all of them, and a constant's section covers every use of that constant.
#
# The owner's rule: a hard cap on what the user can REACH in a list is never acceptable; a bound on
# WORK is fine. So:
#
#   class   work        bounds work or memory (per frame, per request, a window, concurrency);
#                       everything past it is still reachable
#           preview     a summary length whose full list is reachable; `route` names how
#           format      a limit of a format, protocol or hardware, not of a list the user browses
#           not-a-list  text length, retries, geometry, a buffer, remembered history
#           reach       a real cap on reachable content. Allowed ONLY with `status = open` and a
#                       reason saying what the user loses; the lint prints it loudly
#   reason  one sentence
#   route   preview only: the screen or gesture that reaches the full list
#   status  reach only: `open`
#
# Do not class a site `work` or `preview` on a guess: read the code until you know whether content
# past the bound is reachable. The list only shrinks: removing a cap removes its section.

