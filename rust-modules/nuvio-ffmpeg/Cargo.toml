[package]
name = "plx_nuvio_ffmpeg"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Fork Rofocale11: the retained low-level FFmpeg ABI, dev encoder and probe moved out of upstream's media::ff."
publish = false

# Fork Rofocale11: this crate's lib.rs is ONE module of the application tree, not its root, so
# `ci/module_graph.py` resolves `plx_nuvio_ffmpeg::boot` and the `crate::` paths written inside it
# to the `nuvio_ffmpeg` member of ci/module-layers.ini. Without the mount both claim `crate`.
[package.metadata.plx]
mount = "nuvio_ffmpeg"

[lib]
name = "plx_nuvio_ffmpeg"
crate-type = ["rlib"]

[features]
# The ffprobe dev trigger reads its URL through this; off by default, as everywhere else.
devtriggers = ["plx_base/devtriggers"]

[dependencies]
plx_base = { path = "../base" }
plx_media_codecs = { path = "../media-codecs" }

[lints]
workspace = true
