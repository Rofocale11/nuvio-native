[package]
name = "plx_stremio"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "NuvioNative backend: Stremio addon protocol client, Nuvio account/addon import, stream classification."
publish = false

[lib]
name = "plx_stremio"
crate-type = ["rlib"]

[features]
default = []
# Live network tests against public addons (Cinemeta, Torrentio). Off by default; `cargo test
# -p plx_stremio --features live-tests` runs them.
live-tests = []

[dependencies]
plx_base = { path = "../base" }
plx_net = { path = "../net" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }

[lints]
workspace = true
