[package]
name = "plx_pmsshim"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "NuvioNative PMS shim: an in-process, loopback-only HTTP server that answers the Plex Media Server dialect the PlxNative front end speaks, backed by Stremio addons (plx_stremio)."
publish = false

[lib]
name = "plx_pmsshim"
crate-type = ["rlib"]

[[bin]]
name = "pmsshim-serve"
path = "src/bin/serve.rs"

[dependencies]
# The event log (`plx_base::eventlog`): the detail read's own timing line lands in the same log
# the app writes, so one grep on the television shows both sides of the loopback.
plx_base = { path = "../base" }
plx_net = { path = "../net" }
# The app's own bounded artwork cache (`imgcache`): a cropped title logo is stored there once
# instead of re-decoding and re-encoding the same PNG on every request.
plx_platform = { path = "../platform" }
plx_stremio = { path = "../stremio" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
# gunzip of addon subtitle downloads (already in the tree through `image`'s png decoder).
flate2 = "1"
# The Nuvio sign-in QR the shim serves in place of plex.tv's (both already in the tree via `ui`/`image`).
qrcodegen = "=1.8.0"
png = "0.18"
# Cutting a title logo's transparent border: PNG decode + crop + re-encode, pure Rust, already
# compiled for the UI (`gfx::img`) at every other feature the tree uses.
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
# `shim_store.rs` tests use `plx_base::testscratch`; `test-support` is the feature that exposes it
# (plx_base/Cargo.toml:24-27 — enabled from a crate's dev-deps, never shipped). Needed so a bare
# `cargo nextest run -p plx_pmsshim` passes without `--features plx_base/test-support` on the CLI.
plx_base = { path = "../base", features = ["test-support"] }

[lints]
workspace = true
