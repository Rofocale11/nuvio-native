[package]
name = "plx_pmsshim"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "NuvioNative PMS shim: an in-process, loopback-only HTTP server that answers the Plex Media Server dialect the PlxNative front end speaks, backed by Stremio addons (plx_stremio)."
publish = false

[lib]
name = "plx_pmsshim"
crate-type = ["rlib"]

[[bin]]
name = "pmsshim-serve"
path = "src/bin/serve.rs"

[dependencies]
plx_net = { path = "../net" }
# The app's own bounded artwork cache (`imgcache`): a cropped title logo is stored there once
# instead of re-decoding and re-encoding the same PNG on every request.
plx_platform = { path = "../platform" }
plx_stremio = { path = "../stremio" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc", "std"] }
# gunzip of addon subtitle downloads (already in the tree through `image`'s png decoder).
flate2 = "1"
# The Nuvio sign-in QR the shim serves in place of plex.tv's (both already in the tree via `ui`/`image`).
qrcodegen = "=1.8.0"
png = "0.18"
# Cutting a title logo's transparent border: PNG decode + crop + re-encode, pure Rust, already
# compiled for the UI (`gfx::img`) at every other feature the tree uses.
image = { version = "0.25", default-features = false, features = ["png"] }

[lints]
workspace = true
